name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any push, so newly-disclosed advisories against
    # already-committed dependency versions get caught even with no code
    # changes.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo audit (Rust dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  pip-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Extract declared dependencies from pyproject.toml
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          deps = data['project']['dependencies']
          with open('requirements-audit.txt', 'w') as out:
              out.write('\n'.join(deps) + '\n')
          "

      - name: Run pip-audit against declared dependencies
        run: pip-audit -r requirements-audit.txt
