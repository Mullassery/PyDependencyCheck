[build-system]
requires = ["maturin[pyo3]>=1.4,<2.0"]
build-backend = "maturin"

[package]
name = "pydependencycheck"
version = "1.4.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Proprietary"
repository = "https://github.com/Mullassery/PyDependencyCheck"
description = "Dependency intelligence and governance platform for Python"

[lib]
name = "_pydependencycheck"
crate-type = ["cdylib"]
path = "crates/pydep-py/src/lib.rs"

[workspace]
members = [
    "crates/pydep-parser",
    "crates/pydep-graph",
    "crates/pydep-ast",
    "crates/pydep-security",
]
resolver = "2"

[workspace.package]
version = "1.4.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Proprietary"
repository = "https://github.com/Mullassery/PyDependencyCheck"

[workspace.dependencies]
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
thiserror = "1.0"
tracing = "0.1"
rayon = "1.8"
tree-sitter = "0.20"
tree-sitter-python = "0.20"
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1.35", features = ["full"] }
pyo3 = { version = "0.21", features = ["extension-module"] }
semver = "1.0"
dirs = "5.0"

[dependencies]
pydep-parser = { path = "crates/pydep-parser" }
pydep-graph = { path = "crates/pydep-graph" }
pydep-ast = { path = "crates/pydep-ast" }
pydep-security = { path = "crates/pydep-security" }
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[profile.release]
opt-level = 3
lto = true
