<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CodeAtlas</title>
<script src="https://unpkg.com/cytoscape@3.23.0/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  #cy { width: 100vw; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<header>
  <strong>CodeAtlas</strong>
  <p>Owns 0 symbols across 0 file(s).</p>
</header>
<div id="cy"></div>
<script>
const data = {"nodes": [{"data": {"id": "pydep_ast", "label": "pydep-ast", "description": "Owns 0 symbols across 1 file(s).", "linkUrl": "./pydep_ast.html"}}, {"data": {"id": "pydep_graph", "label": "pydep-graph", "description": "Owns 0 symbols across 1 file(s).", "linkUrl": "./pydep_graph.html"}}, {"data": {"id": "pydep_parser", "label": "pydep-parser", "description": "Owns 0 symbols across 1 file(s).", "linkUrl": "./pydep_parser.html"}}, {"data": {"id": "pydep_py", "label": "pydep-py", "description": "Owns 0 symbols across 1 file(s).", "linkUrl": "./pydep_py.html"}}, {"data": {"id": "pydep_security", "label": "pydep-security", "description": "Owns 0 symbols across 1 file(s).", "linkUrl": "./pydep_security.html"}}], "edges": [{"data": {"id": "edge_0", "source": "pydep_ast", "target": "pydep_security", "label": "calls"}}, {"data": {"id": "edge_1", "source": "pydep_graph", "target": "pydep_security", "label": "calls"}}, {"data": {"id": "edge_2", "source": "pydep_parser", "target": "pydep_security", "label": "calls"}}, {"data": {"id": "edge_3", "source": "pydep_py", "target": "pydep_ast", "label": "calls"}}, {"data": {"id": "edge_4", "source": "pydep_py", "target": "pydep_security", "label": "calls"}}]};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: data,
  style: [
    { selector: 'node', style: {
      'label': 'data(label)',
      'shape': 'round-rectangle',
      'background-color': '#eef2ff',
      'border-color': '#6366f1',
      'border-width': 1,
      'width': 'label',
      'padding': '10px',
      'text-valign': 'center',
      'text-halign': 'center',
      'font-size': '12px',
    }},
    { selector: 'edge', style: {
      'label': 'data(label)',
      'curve-style': 'bezier',
      'target-arrow-shape': 'triangle',
      'font-size': '10px',
      'text-rotation': 'autorotate',
    }}
  ],
  layout: { name: 'dagre', rankDir: 'LR' }
});
cy.on('tap', 'node', evt => {
  const node = evt.target;
  if (node.data('linkUrl')) { window.location.href = node.data('linkUrl'); }
});
</script>
</body>
</html>
