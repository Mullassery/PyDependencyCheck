[build-system]
requires = ["maturin[pyo3]>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pydependencycheck"
version = "1.2.0"
description = "Dependency intelligence and governance platform for Python projects"
authors = [
    {name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com"}
]
license = {text = "Proprietary License — Free to use with explicit attribution"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: Security",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0",
    "gitpython>=3.1.0",
    "networkx>=3.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "requests>=2.30.0",
    "tomli>=1.2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.2.0",
]
visualization = [
    "plotly>=5.0",
    "matplotlib>=3.5",
]
otel = [
    "opentelemetry-api>=1.0",
    "opentelemetry-sdk>=1.0",
    "opentelemetry-exporter-jaeger>=1.0",
    "opentelemetry-exporter-otlp>=0.43b0",
    "opentelemetry-exporter-prometheus>=0.43b0",
]
sbom = [
    "cryptography>=41.0",
]

[project.scripts]
pydependencycheck = "pydependencycheck.cli:main"

[project.urls]
Repository = "https://github.com/Mullassery/pydependencycheck"
Issues = "https://github.com/Mullassery/pydependencycheck/issues"
Documentation = "https://github.com/Mullassery/pydependencycheck/blob/main/README.md"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pydependencycheck._pydependencycheck"

[tool.black]
line-length = 120
target-version = ['py38']

[tool.ruff]
line-length = 120
target-version = "py38"
select = [
    "E",
    "F",
    "W",
    "I",
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-vv --cov=pydependencycheck --cov-report=term-missing"

[tool.coverage.run]
source = ["pydependencycheck"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
